# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_dart-avro
# Analysed by .github/workflows/ci.yml (sonar.yml) on every pull request and on summer; Automatic Analysis is off.
sonar.organization=paxel
sonar.projectKey=paxel_dart-avro
sonar.projectName=dart-avro

sonar.sources=lib,scripts,.github/workflows
sonar.tests=test,tests/site
sonar.sourceEncoding=UTF-8

# Coverage: dart.yml and ts.yml keep the lcov of each part here. Dart from the shared Dart gate,
# the site build in scripts/ from the shared TypeScript gate (the site tests).
sonar.dart.lcov.reportPaths=coverage/dart.lcov
sonar.javascript.lcov.reportPaths=coverage/site.lcov

# SonarQube Cloud analyses the whole repository, whatever sonar.sources says. The developer
# tools in tool/ (benchmarks, fuzzing, interop, test data) are analysed but not measured: no
# test runs them, and they are not in the pub.dev archive.
sonar.coverage.exclusions=tool/**
