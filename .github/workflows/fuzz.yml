name: Fuzz

# The repository's fuzz targets, weekly and by hand, from paxel/gates: the decoder and the
# container file reader, mutation-fuzzed by tool/fuzz/fuzz.dart (avro-1010).
on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: paxel/gates/.github/workflows/fuzz.yml@ccb900ba534004ed8bb410f1f48c4097d9a9f530 # v1.3.0
    with:
      stack: dart
      targets: |
        tool/fuzz/fuzz.dart
      seconds: 600
