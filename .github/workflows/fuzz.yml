name: Fuzz

# The repository's fuzz targets, weekly and by hand, from paxel/gates: the decoder and the
# container file reader, mutation-fuzzed by tool/fuzz/fuzz.dart (avro-1010).
on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: paxel/gates/.github/workflows/fuzz.yml@385f7ac316aef261a56e46bfc1e3553fa2efaccd # v1.4.0
    with:
      stack: dart
      targets: |
        tool/fuzz/fuzz.dart
      seconds: 600
