name: Release

# A release: the gate first, then the archive of the tagged tree, then provenance, then the
# GitHub release, then the package on pub.dev. pub.dev accepts only a tag push from this
# repository, through its automated publishing (docs/releasing.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          pubspec=$(sed -n 's/^version:[[:space:]]*\([^+#[:space:]]*\).*/\1/p' pubspec.yaml)
          if [ "$version" != "$pubspec" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the pubspec.yaml version $pubspec"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  gate:
    needs: version
    uses: paxel/gates/.github/workflows/release-gate.yml@ccb900ba534004ed8bb410f1f48c4097d9a9f530 # v1.3.0
    permissions:
      contents: read
      security-events: read
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      alerts-token: ${{ secrets.GATES_ALERTS_TOKEN }}

  build:
    needs: [version, gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive the tagged tree
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="avro-$VERSION/" -o "dist/avro-$VERSION.tar.gz" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-source
          path: dist/

  provenance:
    needs: build
    uses: paxel/gates/.github/workflows/provenance.yml@ccb900ba534004ed8bb410f1f48c4097d9a9f530 # v1.3.0
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      name: dart-avro
      tag: ${{ github.ref_name }}
      artifacts: dist-*

  publish:
    needs: [version, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Release notes from the CHANGELOG section
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: notes.md
          files: dist/*

  pub-dev:
    needs: publish
    permissions:
      contents: read
      id-token: write # pub.dev authenticates the tag push through OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      environment: pub.dev
      sdk: 3.14.0
      use-flutter: false
