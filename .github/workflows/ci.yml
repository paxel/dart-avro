name: CI

# The gates every pull request and every push to summer runs, from paxel/gates (the standard:
# its standard.toml). Sonar waits for the Dart and TypeScript gates because it reads the
# coverage they measured.
# A branch gets its run through its pull request; a run per push as well would be the same
# jobs twice, and SonarQube Cloud analyses only the default branch and pull requests.
on:
  push:
    branches: [summer]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vulns:
    uses: paxel/gates/.github/workflows/vulns.yml@ccb900ba534004ed8bb410f1f48c4097d9a9f530 # v1.3.0

  dart:
    uses: paxel/gates/.github/workflows/dart.yml@ccb900ba534004ed8bb410f1f48c4097d9a9f530 # v1.3.0
    with:
      packages: |
        dart .

  # The archive pub.dev would get: dart pub publish --dry-run fails on any warning.
  pub:
    name: pub.dev dry run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: 3.14.0
      - run: dart pub get --enforce-lockfile
      - run: dart pub publish --dry-run

  # The JavaScript is the documentation site's, plain JavaScript type-checked by tsc (checkJs).
  # The part is named site: the gate's tests are the site tests, which measure the site build
  # in scripts/.
  ts:
    uses: paxel/gates/.github/workflows/ts.yml@ccb900ba534004ed8bb410f1f48c4097d9a9f530 # v1.3.0
    with:
      packages: site .

  sonar:
    needs: [dart, ts]
    uses: paxel/gates/.github/workflows/sonar.yml@ccb900ba534004ed8bb410f1f48c4097d9a9f530 # v1.3.0
    secrets:
      sonar-token: ${{ secrets.SQ_TOKEN }}
