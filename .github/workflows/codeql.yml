name: CodeQL

# CodeQL on every push, pull request and weekly, from paxel/gates. languages lists what CodeQL
# can analyse here (rust, python, javascript-typescript, java-kotlin, go); the workflows are
# always analysed. CodeQL has no Dart: a Dart repository keeps '[]'.
on:
  push:
    branches: [summer]
  pull_request:
  schedule:
    - cron: "47 4 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    uses: paxel/gates/.github/workflows/codeql.yml@ccb900ba534004ed8bb410f1f48c4097d9a9f530 # v1.3.0
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["javascript-typescript"]'
